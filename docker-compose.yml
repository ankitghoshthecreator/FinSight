version: "3.8"

services:
  finsight-api:
    build:
      context: .
      file: docker/Dockerfile
    container_name: finsight-rag-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=FinSight RAG API
      - APP_VERSION=2.0.0
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - VECTOR_STORE_BACKEND=faiss
      - FAISS_PERSIST_DIR=/app/data/faiss_index
      - RATE_LIMIT_PER_MINUTE=60
      - FINSIGHT_TEST_MODE=true
      - QDRANT_URL=http://qdrant:6333
    volumes:
      - finsight-faiss-data:/app/data/faiss_index
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      qdrant:
        condition: service_healthy

  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: finsight-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - finsight-qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  finsight-faiss-data:
    driver: local
  finsight-qdrant-data:
    driver: local
